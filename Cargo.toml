[package]
name = "minkey"
version = "0.1.0"
edition = "2024"

[dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_Ime",
    "Win32_System_Registry",
    "Win32_System_Memory",
] }
slint = "1.18.1"

[build-dependencies]
slint-build = "1.18.1"


